name: Windows desktop
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'api/**', 'cmd/**', 'config/**', 'internal/**', 'models/**', '*.go', 'go.mod', 'go.sum', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'api/**', 'cmd/**', 'config/**', 'internal/**', 'models/**', '*.go', 'go.mod', 'go.sum', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and package (does not modify networking)
        shell: powershell
        run: ./desktop/build.ps1 -DownloadWintun
      - name: Build the release installer
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $iscc = ${env:ProgramFiles(x86)} + '\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $user = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
            if (Test-Path $user) { $iscc = $user }
          }
          & $iscc desktop\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: usque-desktop-win-x64
          path: |
            dist/desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: usque-desktop-setup-1.3.2
          path: dist/UsqueDesktop-Setup-1.3.2.exe
