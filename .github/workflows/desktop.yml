name: Windows desktop
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'api/**', 'cmd/**', 'config/**', 'internal/**', 'models/**', '*.go', 'go.mod', 'go.sum', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'api/**', 'cmd/**', 'config/**', 'internal/**', 'models/**', '*.go', 'go.mod', 'go.sum', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      # One step: tests, clean package, verified Wintun, completeness checks,
      # installer compilation and a SHA-256 file. Never modifies networking.
      - name: Test, package and build the installer
        shell: powershell
        run: ./desktop/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: usque-desktop-win-x64
          path: |
            dist/desktop-*/
            !dist/desktop-*/*.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: usque-desktop-setup
          path: |
            dist/UsqueDesktop-Setup-*.exe
            dist/UsqueDesktop-Setup-*.exe.sha256
